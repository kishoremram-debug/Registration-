<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  overflow:hidden;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)
}
.circle{position:absolute;border-radius:50%;filter:blur(2px);animation:float 8s infinite ease-in-out}
.circle:nth-child(1){width:250px;height:250px;background:rgba(0,255,255,.18);top:-80px;left:-80px}
.circle:nth-child(2){width:300px;height:300px;background:rgba(150,0,255,.2);bottom:-120px;right:-100px;animation-delay:2s}
.circle:nth-child(3){width:150px;height:150px;background:rgba(255,0,150,.15);top:40%;right:15%;animation-delay:4s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
.card{
  position:relative;width:410px;max-width:92%;padding:35px;
  border-radius:25px;background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 25px 60px rgba(0,0,0,.45);
  animation:appear .8s ease
}
@keyframes appear{from{opacity:0;transform:translateY(35px) scale(.95)}to{opacity:1;transform:none}}
h1{text-align:center;color:white;margin-bottom:8px;font-size:30px}
.subtitle{text-align:center;color:rgba(255,255,255,.65);margin-bottom:25px;font-size:14px}
.input{margin-bottom:15px}
.input input{
  width:100%;padding:14px 15px;border:1px solid rgba(255,255,255,.15);
  outline:none;border-radius:12px;background:rgba(255,255,255,.1);
  color:white;font-size:15px;transition:.3s
}
.input input::placeholder{color:rgba(255,255,255,.5)}
.input input:focus{border-color:#00eaff;box-shadow:0 0 15px rgba(0,234,255,.25)}
.terms{display:flex;gap:8px;align-items:flex-start;color:rgba(255,255,255,.7);font-size:12px;margin:8px 0 20px}
.terms input{margin-top:2px;accent-color:#00eaff}
button{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:linear-gradient(90deg,#00eaff,#8a2be2);
  color:white;font-size:16px;font-weight:bold;cursor:pointer;transition:.3s
}
button:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,234,255,.3)}
button:active{transform:scale(.97)}
#message{text-align:center;margin-top:17px;min-height:20px;font-size:14px}
.success{color:#00ffae;animation:pop .4s ease}
.error{color:#ff6680}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@media(max-width:450px){.card{padding:28px 22px}}
</style>
</head>
<body>
<div class="circle"></div><div class="circle"></div><div class="circle"></div>

<div class="card">
  <h1>Create Account</h1>
  <p class="subtitle">Register to get started</p>

  <form id="registerForm">
    <div class="input"><input id="name" type="text" placeholder="Full Name" required></div>
    <div class="input"><input id="email" type="email" placeholder="Email Address" required></div>
    <div class="input"><input id="username" type="text" placeholder="Username" required></div>
    <div class="input"><input id="password" type="password" placeholder="Password" minlength="6" required></div>
    <div class="input"><input id="confirm" type="password" placeholder="Confirm Password" minlength="6" required></div>

    <label class="terms">
      <input id="terms" type="checkbox" required>
      <span>I agree to the terms and conditions.</span>
    </label>

    <button type="submit">Create Account</button>
  </form>

  <div id="message"></div>
</div>

<script>
const form=document.getElementById("registerForm");
const message=document.getElementById("message");

form.addEventListener("submit",function(e){
  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password!==confirm){
    message.textContent="✕ Passwords do not match!";
    message.className="error";
    return;
  }

  // Demo only: saves profile details locally, but NOT the password.
  localStorage.setItem("registeredName",name);
  localStorage.setItem("registeredEmail",email);
  localStorage.setItem("registeredUsername",username);

  message.textContent="✓ Registration details saved!";
  message.className="success";
  form.reset();
});
</script>
</body>
</html>
